name: Probe Money Currency

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/probe_money_currency.py'
      - '.github/workflows/probe-money-currency.yml'
      - 'Game/Thần Long  Mobile_Data/StreamingAssets/Interface.unity3d'
      - 'Game/Thần Long  Mobile_Data/StreamingAssets/Translations.unity3d'
      - 'Game/Thần Long  Mobile_Data/il2cpp_data/Metadata/global-metadata.dat'
  workflow_dispatch:

jobs:
  probe-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UnityPy
        run: python -m pip install --disable-pip-version-check UnityPy
      - name: Probe money runtime semantics
        run: python tools/probe_money_currency.py | tee money_probe.txt
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-currency-probe
          path: money_probe.txt
          if-no-files-found: error
