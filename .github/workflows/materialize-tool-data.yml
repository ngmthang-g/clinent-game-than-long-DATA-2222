name: Materialize tool database

on:
  workflow_dispatch:
  push:
    paths:
      - 'Game/Thần Long  Mobile_Data/StreamingAssets/Config.unity3d'
      - 'tools/materialize_tool_data.py'
      - 'tools/materialize_all_config.py'
      - '.github/workflows/materialize-tool-data.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check lz4
      - name: Regenerate tool databases
        run: |
          python tools/materialize_tool_data.py \
            --config "Game/Thần Long  Mobile_Data/StreamingAssets/Config.unity3d" \
            --repo-root .
      - name: Regenerate all-Config fallback database
        run: |
          python tools/materialize_all_config.py \
            --config "Game/Thần Long  Mobile_Data/StreamingAssets/Config.unity3d" \
            --repo-root .
      - name: Commit generated database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/fuben database/static database/config_full database/PC_INPUT_KEY_BINDINGS.csv database/TOOL_DATA_MATERIALIZATION_MANIFEST.csv
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "data: regenerate tool and all-Config databases"
            git push
          fi
